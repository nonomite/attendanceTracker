<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tertulia Attendance Tracker</title>
    <link href="../style.css" rel="stylesheet">
</head>
  <body>
    <main class="timein-main">
        <div class="timein-card">
            <form id="loginForm" class="timein-form">
                <h1 class="timein-title">Admin Login</h1>
                <div class="form-group">
                    <input class="form-control" type="email" placeholder="Enter Admin Email" id="adminEmail" name="adminEmail" required>
                </div>
                <div class="form-group mt-4">
                    <input class="form-control" type="password" placeholder="Enter Admin Password" id="adminPassword" name="adminPassword" required>
                </div>
                <div class="form-group mt-4">
                    <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Login</button>
                </div>
            </form>
            <p id="loginError" class="timein-message" hidden></p>
        </div>
    </main>
     <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
     <script src="../supabase-client.js"></script>
     <script src="auth.js" defer></script>
  </body>
</html>
